<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Puzzle Game</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23ff00ff' width='50' height='50'/><rect fill='%2300ffff' x='50' width='50' height='50'/><rect fill='%23ffff00' y='50' width='50' height='50'/><rect fill='%23ff0080' x='50' y='50' width='50' height='50'/></svg>">
</head>
<body>
    <div class="container">
        <header class="game-header">
            <h1>RETRO PUZZLE</h1>
            <div class="header-info">
                <div class="score-display">
                    <div class="label">SCORE</div>
                    <div class="value" id="score">0</div>
                </div>
                <div class="level-display">
                    <div class="label">LEVEL</div>
                    <div class="value" id="level">1</div>
                </div>
            </div>
        </header>

        <main class="game-container">
            <canvas id="gameCanvas" width="300" height="400"></canvas>
            <aside class="game-sidebar">
                <div class="next-piece-box">
                    <div class="label">NEXT</div>
                    <canvas id="nextCanvas" width="100" height="100"></canvas>
                </div>

                <div class="controls-box">
                    <div class="label">CONTROLS</div>
                    <ul class="controls-list">
                        <li><kbd>↑</kbd> Rotate</li>
                        <li><kbd>←</kbd> Left</li>
                        <li><kbd>→</kbd> Right</li>
                        <li><kbd>↓</kbd> Drop</li>
                        <li><kbd>SPACE</kbd> Quick Drop</li>
                        <li><kbd>P</kbd> Pause</li>
                    </ul>
                </div>

                <div class="status-box">
                    <button id="pauseBtn" class="btn btn-primary">PAUSE</button>
                    <button id="resetBtn" class="btn btn-secondary">NEW GAME</button>
                </div>

                <div class="stats-box">
                    <div class="stat">
                        <span class="stat-label">Lines Cleared:</span>
                        <span class="stat-value" id="linesCleared">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Best Score:</span>
                        <span class="stat-value" id="bestScore">0</span>
                    </div>
                </div>
            </aside>
        </main>

        <footer class="game-footer">
            <p>90's Retro Puzzle Game • Open Source • <a href="https://github.com">GitHub</a></p>
        </footer>
    </div>

    <!-- Webpack bundle will be injected here -->
</body>
</html>
